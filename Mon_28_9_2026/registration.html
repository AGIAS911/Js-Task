
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Page</title>

    <link rel="stylesheet" href="registration.css">
</head>

<body>

    <main>

        <form
            id="regForm"
            class="reg-form"
        >

            <label for="fullName">
                Full Name
            </label>

            <input
                id="fullName"
                class="full-name"
                type="text"
                placeholder="Enter your full name"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                id="email"
                class="email"
                type="email"
                placeholder="name@example.com"
                required
            >


            <label for="address">
                Address
            </label>

            <input
                id="address"
                class="address"
                type="text"
                placeholder="Enter your address"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                id="password"
                class="id"
                type="password"
                placeholder="********"
                required
            >


            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                id="confirmPassword"
                class="confirm-password"
                type="password"
                placeholder="********"
                required
            >

            <br>

            <button
                id="registerButton"
                class="register-button"
                type="submit"
            >
                Register
            </button>

        </form>

        <p>
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </main>


    <script
        type="module"
        src="script.js">
    </script>

</body>

</html>
